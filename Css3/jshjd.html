<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            background-color: #f5f5f5;
        }

        .container {
            width: 300px;
            height: 200px;
            margin: 100px auto;
            position: relative;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 15px solid;
        }

        .container::before {
            border-color: #ff0099;
            transform: rotate(5deg);
            top: 10px;
            left: -10px;
        }

        .container::after {
            border-color: #0099ff;
            transform: rotate(-5deg);
            top: -10px;
            left: 10px;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: #0099ff;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">Elzero</div>
    </div>
</body>
</html>
