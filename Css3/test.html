<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Animation</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #222;
    color: #fff;
    font-family: 'Arial', sans-serif;
  }

  .letter-container {
    font-size: 500px;
    position: relative;
  }

  /* المربع داخل L */
  .letter-container .L::before {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    bottom: 0;
    left: 0;
    opacity: 0;
    animation: moveL 3s forwards;
  }

  /* المربع داخل E */
  .letter-container .E::before {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    background: blue;
    top: 0;
    left: 0;
    opacity: 1;
    animation: moveE 6s forwards;
    animation-delay: 3s; /* يبدأ بعد L يخلص */
  }

  .L, .E {
    display: inline-block;
    position: relative;
  }

  /* انيميشن L */
  @keyframes moveL {
    0% { bottom: -30px; left: 0; opacity: 0; }
    10% { opacity: 1; }
    50% { bottom: 100%; left: -50px; opacity: 1; }
    100% { bottom: 100%; left: -50px; opacity: 0; }
  }

  /* انيميشن E */
  @keyframes moveE {
    0% { top: 0; left: 0; }
    20% { left: -50px; top: 0; }
    40% { left: 0; top: 50px; }
    60% { left: -50px; top: 50px; }
    80% { left: 0; top: 100px; }
    100% { left: 0; top: 0; }
  }
</style>
</head>
<body>
  <div class="letter-container">
    <span class="L">L</span>
    <span class="E">E</span>
  </div>
</body>
</html>
