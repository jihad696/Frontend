<!DOCTYPE html>
<html lang="en">
<head>
    <title>My First Page</title>

    <!-- Meta Tags: Provide information about the page -->

    <!-- 
        1. charset
        Defines the character encoding for the page.
        UTF-8 supports almost all letters, symbols, and languages.
    -->
    <meta charset="UTF-8" />

    <!-- 
        2. description
        Gives a short summary of the page.
        Useful for search engines; does NOT appear on the page.
    -->
    <meta name="description" content="This Is Description For My First Page" />

    <!-- 
        3. keywords
        List of keywords relevant to the page.
        Helps search engines understand the content.
    -->
    <meta name="keywords" content="HTML, CSS, JavaScript, Frontend" />

    <!-- 
        4. viewport
        Controls how the page is displayed on mobile devices.
        Makes the page responsive.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Empty CSS and JS as requested -->
    <style></style>
    <script></script>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Task Indicator -->
    This is Task

    <!-- Task 1: What HTML stands for -->
    HTML = Hypertext Markup Language

    <!-- Task 2: Text to display on page -->
    This Is My First Page

    <!-- Task 3: Yes/No Questions -->
    Question 01 => No
    Question 02 => Yes
    Question 03 => Yes
    Question 04 => No
</body>
</html>
