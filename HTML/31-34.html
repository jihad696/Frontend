<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Form</title>
</head>


<body>
    <form action="" method="get" target="_blank" novalidate>

        <!-- assign 1 -->
        <label for="search">Search</label>
        <input type="search" name="search" id="search" placeholder="Enter a search word"><hr>

        <label for="file">Choose File</label>
        <input type="file" name="file" id="file"><hr>

        <label for="url">URL</label>
        <input type="url" name="url" id="url" required><hr>

         <!-- assign 2 -->
          <label for="date">Date</label>
          <input type="date" name="date" id="date" value="1982-10-25"><hr>

          <label for="month_date">Month</label>
          <input type="month" name="month_date" id="month_date" value="1982-10"><hr>

          <!-- assign 3 -->
           <pre>
               Hello Line One
               Hello Line Two
               Hello Line Three
                    Hello Line Four
           </pre>

           <!-- Assign 4 -->
            <iframe src="https://elzero.org/" frameborder="1" width="100%" height="400px"></iframe><hr>
 
        <input type="reset" value="Empty">
        <input type="submit" value="Save">
    </form>
</body>
</html>
