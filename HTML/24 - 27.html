<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Task</title>
</head>
<body>

<form action="test.py" method="post">

    <label for="usr">Username</label>
    <input type="text" id="usr" name="username" required placeholder="Enter your username">
    <hr>

    <label for="psd">Password</label>
    <input type="password" id="psd" name="password" placeholder="Enter strong password">
    <hr>

    <label for="mobile">Mobile</label>
    <input
        type="tel"
        id="mobile"
        name="mobile"
        placeholder="+20100 (234) 123"
        pattern="\+[0-9]{1,3}[0-9]{2} \([0-9]{3}\) [0-9]{3}">
    <hr>

    <label for="eml">Email</label>
    <input type="email" id="eml" name="email" required placeholder="example@email.com">
    <hr>

    <label for="sub">Subject</label>
    <input type="text" id="sub" name="subject" placeholder="Enter subject">
    <hr>

    <input type="hidden" name="hidden_value" value="9"><hr>

    <!-- assign 2 -->
     <input type="range" id="range" name="range" value="400" min="100" max="400" step="50"><hr>

    <input type="submit" value="Send Data">
    <input type="reset" value="Empty Form">



</form>
<hr>
    <h2>the result</h2>
    <img src="image.png" alt="">

</body>
</html>
