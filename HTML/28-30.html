<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part two Form</title>
</head>
<body>

    <form action="" method="post">
        <!-- assign 1 -->
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autofocus minlength="5" maxlength="20" required><hr>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" readonly value="o@o.com"><hr>

        <input type="hidden" name="hidden_value" value="b92f1fc2fce391ad7af633723afd3055"><hr>

        <!-- assign 2 -->
        <label>Skills (choose one or more):</label><br>
        <input type="checkbox" id="ps" name="skills" value="Problem Solving" checked>
        <label for="ps">Problem Solving</label><br>

        <input type="checkbox" id="lt" name="skills" value="Logical Thinking">
        <label for="lt">Logical Thinking</label><br>

        <input type="checkbox" id="as" name="skills" value="Advanced Search">
        <label for="as">Advanced Search</label><br>

        <input type="checkbox" id="an" name="skills" value="Analysis">
        <label for="an">Analysis</label><br>

        <input type="checkbox" id="pl" name="skills" value="Planning">
        <label for="pl">Planning</label><hr>

        <label>Job (choose one):</label><br>
        <input type="radio" id="fe" name="job" value="Front-End Developer" checked>
        <label for="fe">Front-End Developer</label><br>

        <input type="radio" id="be" name="job" value="Back-End Developer">
        <label for="be">Back-End Developer</label><br>

        <input type="radio" id="ba" name="job" value="Business Analyst">
        <label for="ba">Business Analyst</label><br>

        <input type="radio" id="pm" name="job" value="Project Manager">
        <label for="pm">Project Manager</label><br>

        <input type="radio" id="sm" name="job" value="Scrum Master">
        <label for="sm">Scrum Master</label><hr>

        <!-- assign 3 -->
        <label for="Book">Choose Book:</label>
        <select name="Book" id="Book">
            <optgroup label="PHP">
                <option value="v5.0" selected>v5.0</option>
                <option value="v7.0">v7.0</option>
                <option value="v8.0">v8.0</option>
            </optgroup>
            <optgroup label="Python">
                <option value="v2.0">v2.0</option>
                <option value="v3.0">v3.0</option>
                <option value="v3.9">v3.9</option>
            </optgroup>
        </select><hr>

        <textarea name="subject" id="subject" cols="55" rows="10" placeholder="Write Here Why You Want To Learn Programming"></textarea><hr>

        <input type="reset" value="Empty">
        <input type="submit" value="Send">
    </form>

</body>
</html>
